<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1430">
<title>Paikutan Controller</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Nunito:wght@400;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body class="phone-page show-scene">
<canvas id="view"></canvas>
<div id="ctrl"></div>
<div id="corner"><button id="btn-music" title="Music">🎵</button><button id="btn-mute" title="Mute">🔊</button></div>
<div id="lost" hidden>Lost connection to the host… retrying</div>
<button class="btn ghost small match-exit" id="leave" hidden>Leave match</button>

<div id="join-screen">
  <h1 class="logo">PAIKUTAN</h1>
  <p class="muted">Your phone is your trumpo.</p>
  <div id="room-row"><label>Room code<br><input id="room" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></label></div>
  <label>Your name<br><input id="name" maxlength="14" autocomplete="nickname" placeholder="Juan"></label>
  <button class="btn big" id="join">Join match</button>
  <a class="small" id="home" href="index.html">Back to menu</a>
  <p class="small" id="join-msg"></p>
  <p class="muted small">Tip: allow motion access when asked, and turn up the volume.</p>
</div>

<script type="module" src="js/play.js"></script>
</body>
</html>
